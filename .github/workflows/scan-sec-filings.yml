name: Scan SEC Filings

# DECOMMISSIONED May 2026 — scheduled runs disabled.
# To resurrect: restore cron schedule from git history and re-enable workflow.
# See Obsidian: AI/projects/shortsec/resurrection-guide.md

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  scan-filings:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased to allow more time for processing
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
        
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Configure environment
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          echo "Environment configured"
      
      - name: Run SEC scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          python3 main.py --filing-count 50
      
      - name: Check for errors
        if: failure()
        run: |
          echo "❌ Scanner failed - check logs above"
          exit 1
